<style>
/* ══════════════════════════════════════════════════════════
   1 · DESIGN TOKENS  (Metzler Design System — inline fallback)
   ══════════════════════════════════════════════════════════ */
:root {
  --font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

  --color-teal-50:  #F2F6F6;
  --color-teal-75:  #E3F2F0;
  --color-teal-100: #E6EEEE;
  --color-teal:     #015253;
  --color-teal-600: #014A4B;
  --color-teal-700: #01292A;
  --color-teal-900: #001D1D;

  --color-metzler-rot:   #D42924;
  --color-digital-black: #1A171B;

  --color-green: #009951;
  --color-mint:  #5CDBD3;

  --color-white: #FFFFFF;
  --color-paper: #F5F6FA;
  --color-graphite-100: #F0F0F0;
  --color-graphite-200: #E6E6E8;
  --color-graphite-300: #DADADA;
  --color-graphite-400: #BFBFC2;
  --color-graphite-450: #CCCCCC;
  --color-graphite-500: #A1A1A1;
  --color-graphite-600: #6A6A6A;
  --color-graphite-700: #54545C;
  --color-graphite-800: #2E2E36;
  --color-graphite-850: #333333;
  --color-graphite-900: #1A1A1F;

  --radius-sm:   0.125rem;
  --radius:      0.25rem;
  --radius-lg:   0.5rem;
  --radius-xl:   0.75rem;
  --radius-pill: 624.94rem;

  --shadow-card:  0 0.125rem 0.5rem rgba(0,0,0,0.08);
  --shadow-hover: 0 0.25rem 1.25rem rgba(0,0,0,0.10);
  --shadow-modal: 0 1.25rem 3.75rem rgba(0,0,0,0.2), 0 0.25rem 1rem rgba(0,0,0,0.1);
}

/* ══════════════════════════════════════════════════════════
   2 · BASE + CONTAINER
   ══════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html { font-size: 100%; }
body {
  margin: 0;
  font-family: var(--font-family);
  color: var(--color-graphite-800);
  background: var(--color-white);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; display: block; }

.container {
  max-width: 100rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}
@media (min-width: 48rem) {
  .container { padding: 0 4rem; }
}

.eyebrow {
  font-size: 0.75rem; font-weight: 700; line-height: 1.4;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--color-teal); margin: 0 0 0.75rem;
}

/* ══════════════════════════════════════════════════════════
   3 · BUTTONS  (Design System §11)
   ══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  height: 2.625rem; padding: 0.7rem 1.2rem;
  border: none; border-radius: var(--radius);
  font-family: var(--font-family); font-size: 1rem; font-weight: 500;
  line-height: 1.2; white-space: nowrap; text-decoration: none; cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.btn-sm { font-size: 0.9rem; font-weight: 400; }
.btn-block { display: flex; width: 100%; text-align: center; }
.btn-primary { background: var(--color-teal); color: var(--color-white); }
.btn-primary:hover  { background: var(--color-teal-600); }
.btn-primary:active { background: var(--color-teal-700); }


/* ══════════════════════════════════════════════════════════
   5 · KATEGORIE-NAV + MEGA-MENÜ
   ══════════════════════════════════════════════════════════ */
.nav {
  position: relative;
  background: var(--color-white);
  border-bottom: 0.0625rem solid var(--color-graphite-200);
}
.nav__inner {
  display: flex; align-items: stretch; gap: 0.25rem;
  overflow-x: auto; white-space: nowrap;
  scrollbar-width: none;
}
.nav__inner::-webkit-scrollbar { display: none; }
.nav__item { position: static; display: flex; }
.nav__link {
  display: flex; align-items: center;
  height: 3rem; padding: 0 0.75rem;
  border: none; background: none;
  font-family: var(--font-family); font-size: 1rem; font-weight: 500;
  color: var(--color-digital-black); text-decoration: none; cursor: pointer;
  border-bottom: 0.125rem solid transparent;
  transition: color 0.14s, border-color 0.14s;
}
.nav__link:hover { color: var(--color-teal); }
.nav__link.is-active {
  color: var(--color-teal);
  border-bottom-color: var(--color-teal);
  font-weight: 700;
}

/* ── Mega-Panel ── */
.mega {
  display: none;
  position: absolute; left: 0; right: 0; top: 100%;
  background: var(--color-white);
  border-top: 0.0625rem solid var(--color-graphite-200);
  box-shadow: var(--shadow-hover);
  z-index: 90;
  white-space: normal;
}
.mega__inner { padding-top: 1.5rem; padding-bottom: 1.75rem; }
.mega__layout { display: grid; gap: 1.5rem; }

.mega__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.25rem 1rem;
}

/* Kachel */
.mega-tile { text-decoration: none; display: block; }
.mega-tile__media {
  display: block; padding: 0.5rem;
  background: var(--color-white);
  border: 0.0625rem solid var(--color-graphite-200);
  border-radius: var(--radius-lg);
  /* Nur Rahmen und Schatten reagieren — keine Bewegung, kein Versatz */
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}
.mega-tile__media img { aspect-ratio: 1 / 1; object-fit: contain; width: 100%; }
.mega-tile__label {
  display: block; margin-top: 0.625rem;
  font-size: 0.875rem; font-weight: 500; line-height: 1.35;
  text-align: center; color: var(--color-graphite-800);
  transition: color 0.16s ease;
}
.mega-tile:hover .mega-tile__media,
.mega-tile:focus-visible .mega-tile__media {
  border-color: var(--color-teal);
  box-shadow: var(--shadow-hover);
}
.mega-tile:hover .mega-tile__label,
.mega-tile:focus-visible .mega-tile__label { color: var(--color-teal); }

/* Teaser rechts — die ganze Karte ist ein Hover-Ziel */
.mega-promo {
  position: relative;
  background: var(--color-teal-50);
  border: 0.0625rem solid var(--color-graphite-200);
  border-radius: var(--radius-lg);
  padding: 1rem;
  /* Nur Schatten und Rahmen reagieren — keine Bewegung, kein Versatz */
  transition: box-shadow 0.16s ease, border-color 0.16s ease;
}
.mega-promo:hover,
.mega-promo:focus-within {
  /* identisch zu den Kacheln: Teal-Rahmen + Shadow-Hover, nur ohne Lift */
  box-shadow: var(--shadow-hover);
  border-color: var(--color-teal);
}
.mega-promo__media {
  background: var(--color-white);
  border-radius: var(--radius-lg);
  padding: 0.375rem;
  margin-bottom: 1rem;
}
.mega-promo__media img {
  aspect-ratio: 1 / 1; object-fit: cover; width: 100%;
  border-radius: var(--radius);
}
.mega-promo__title {
  margin: 0 0 0.5rem;
  font-size: 1.125rem; font-weight: 700; line-height: 1.25;
  letter-spacing: -0.01em; color: var(--color-digital-black);
}

/* Der CTA spannt sich unsichtbar über die ganze Karte — ein Link, keine
   verschachtelten Anker, Klickfläche und Cursor gelten für die gesamte Karte. */
.mega-promo .btn::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-lg); }
.mega-promo .btn:focus-visible { outline: 0.125rem solid var(--color-teal); outline-offset: 0.125rem; }

@media (prefers-reduced-motion: reduce) {
  .mega-promo { transition: none; }
}
.mega-promo__meta {
  margin: 0 0 1rem;
  font-size: 0.8125rem; line-height: 1.5; color: var(--color-graphite-700);
}

/* Panel öffnen: Hover, Tastatur-Fokus oder Klick (Touch) */
@media (min-width: 48rem) {
  .nav__inner { overflow: visible; }
  .nav__item--has-menu:hover .mega,
  .nav__item--has-menu:focus-within .mega,
  .mega.is-open { display: block; }
  .nav__item--has-menu:hover .nav__link { color: var(--color-teal); }

  .mega__layout { grid-template-columns: minmax(0, 1fr) 20rem; gap: 2.5rem; }
  .mega__grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
@media (max-width: 47.9375rem) {
  .mega.is-open { display: block; position: static; box-shadow: none; }
}

/* ══════════════════════════════════════════════════════════
   6 · SHOWCASE — jedes Flyout dauerhaft geöffnet, eines je Abschnitt
   ══════════════════════════════════════════════════════════ */
.mega.is-static {
  display: block;
  position: static;
  box-shadow: none;
  border-top: 0.0625rem solid var(--color-graphite-200);
}
.showcase { margin-top: 3rem; }
.showcase__head { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }
.showcase__title {
  margin: 0;
  font-size: 1.5rem; font-weight: 700; line-height: 1.2;
  letter-spacing: -0.02em; color: var(--color-digital-black);
}
.showcase__count { font-size: 0.875rem; color: var(--color-graphite-600); }
.showcase__frame {
  border-top: 0.0625rem solid var(--color-graphite-200);
  border-bottom: 0.0625rem solid var(--color-graphite-200);
  background: var(--color-white);
}
@media (min-width: 48rem) {
  .showcase { margin-top: 4rem; }
  .showcase__title { font-size: 1.75rem; }
}

#showcases { padding-bottom: 6rem; }
@media (min-width: 48rem) {
  #showcases { padding-bottom: 8rem; }
}
</style>

<!-- ═══════════ DEMO-INHALT ═══════════ -->
<main>
  <!-- Ein Abschnitt je Kategorie, aus dem Template dupliziert -->
  <div id="showcases"></div>
</main>

<script>
// ── Ein Abschnitt je Kategorie: Navigation samt geöffnetem Flyout duplizieren.
// Quelle ist das Template, damit Markup und Bilder nur einmal gepflegt werden.
(function buildShowcases() {
  var host = document.getElementById('showcases');
  var source = document.getElementById('menu-source');
  if (!host || !source) return;
  var sourceNav = source.content.querySelector('.nav');
  if (!sourceNav) return;

  source.content.querySelectorAll('.nav__item--has-menu').forEach(function (item) {
    var label = item.querySelector('.nav__link').textContent.trim();
    var nav = sourceNav.cloneNode(true);

    // Alle Panels aus der Nav-Zeile lösen. Das Flyout dieser Kategorie wandert
    // als Geschwister unter die Navigation — als Flex-Kind würde es die
    // Navigationszeile auseinanderziehen.
    var panel = null, tiles = 0;
    nav.querySelectorAll('.nav__item--has-menu').forEach(function (item) {
      var found = item.querySelector('.mega');
      if (found && item.querySelector('.nav__link').textContent.trim() === label) {
        panel = found;
        tiles = found.querySelectorAll('.mega-tile').length;
      }
      if (found) found.remove();
      item.classList.remove('nav__item--has-menu');
    });
    if (!panel) return;
    panel.classList.add('is-static');

    // Aktiv-Zustand nur auf dieser Kategorie; ARIA-Attribute des Originals entfernen,
    // das Panel ist hier statisch und kein aufklappbares Menü mehr.
    nav.querySelectorAll('.nav__link').forEach(function (link) {
      link.classList.toggle('is-active', link.textContent.trim() === label);
      link.removeAttribute('aria-haspopup');
      link.removeAttribute('aria-expanded');
      link.removeAttribute('aria-controls');
    });
    nav.removeAttribute('aria-label');
    [nav, panel].forEach(function (root) {
      root.querySelectorAll('[id]').forEach(function (node) { node.removeAttribute('id'); });
      root.removeAttribute('id');
      // Die Kacheln stehen sichtbar auf der Seite — nicht mehr verzögert laden.
      root.querySelectorAll('img').forEach(function (img) { img.setAttribute('loading', 'eager'); });
    });

    var section = document.createElement('section');
    section.className = 'showcase';

    var head = document.createElement('div');
    head.className = 'container showcase__head';
    var title = document.createElement('h2');
    title.className = 'showcase__title';
    title.textContent = label;
    var count = document.createElement('span');
    count.className = 'showcase__count';
    count.textContent = tiles + ' Unterkategorien + Teaser';
    head.appendChild(title);
    head.appendChild(count);

    var frame = document.createElement('div');
    frame.className = 'showcase__frame';
    frame.appendChild(nav);
    frame.appendChild(panel);

    section.appendChild(head);
    section.appendChild(frame);
    host.appendChild(section);
  });
})();

// Die Flyouts stehen auf dieser Seite dauerhaft offen. Aufklapp-Logik,
// Escape-Handling und der Sticky-Header entfallen deshalb.
</script>
</body>
</html>
